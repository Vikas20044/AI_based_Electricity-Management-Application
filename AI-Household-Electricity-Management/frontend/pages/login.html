<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Sign In - Electricity Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body style="background-color: #f7f7f7;">

  <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="minimal-card p-4 p-md-5" style="max-width: 440px; width: 100%; border: 2px solid #111111;">

      <div class="text-center mb-4 pb-2 border-bottom">
        <h4 class="fw-bold mb-1 text-uppercase tracking-tight">Electricity Management</h4>
        <p class="text-muted small mb-0">AI Forecasting &amp; Gruha Jyothi Assessment</p>
      </div>

      <div id="loginSuccessMsg" class="alert alert-dark d-none mb-3 py-2 px-3 small border-dark" style="background:#f0f0f0;">
        Registration successful! Please sign in with your registered credentials.
      </div>

      <div id="loginAlertMsg" class="alert-minimal d-none mb-3 py-2 px-3 small"></div>

      <form id="loginForm" autocomplete="off">
        <div class="mb-3">
          <label class="form-label small fw-semibold" for="loginEmail">Email Address</label>
          <input type="email" class="form-control" id="loginEmail" required autocomplete="off">
        </div>

        <div class="mb-4">
          <label class="form-label small fw-semibold" for="loginPassword">Password</label>
          <input type="password" class="form-control" id="loginPassword" required autocomplete="off">
        </div>

        <button type="submit" class="btn-minimal-primary w-100 py-2 mb-3" id="btnLoginSubmit">
          Sign In
        </button>

        <div class="text-center small border-top pt-3">
          <span class="text-muted">Don't have an account?</span>
          <a href="register.html" class="fw-bold ms-1 text-dark">Register with Household Details</a>
        </div>
      </form>

    </div>
  </div>

  <script src="../js/api/api-client.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get("registered") === "true") {
      document.getElementById("loginSuccessMsg").classList.remove("d-none");
    }

    document.getElementById("loginForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const alertBox = document.getElementById("loginAlertMsg");
      const btn = document.getElementById("btnLoginSubmit");
      alertBox.classList.add("d-none");

      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;

      btn.disabled = true;
      btn.innerText = "Signing In...";

      try {
        await ApiClient.login(email, password);
        window.location.replace("ai-forecast.html");
      } catch (err) {
        alertBox.innerText = err.message || "Failed to sign in. Please verify your credentials.";
        alertBox.classList.remove("d-none");
        btn.disabled = false;
        btn.innerText = "Sign In";
      }
    });
  </script>
</body>
</html>
