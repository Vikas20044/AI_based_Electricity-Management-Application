<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Electricity Management</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <div style="max-width: 350px; margin: 60px auto;">
    <fieldset>
      <legend>User Login</legend>
      <h3 style="margin-top: 0; margin-bottom: 5px;">Electricity Management</h3>
      <p style="font-size: 12px; color: #555; margin-top: 0;">Student Project</p>
      <hr>

      <div id="loginSuccessMsg" class="alert-box alert-success d-none">
        Registration successful! Please login.
      </div>

      <div id="loginAlertMsg" class="alert-box alert-danger d-none"></div>

      <form id="loginForm" autocomplete="off">
        <p>
          <label for="loginEmail"><b>Email:</b></label><br>
          <input type="email" id="loginEmail" style="width: 100%;" required autocomplete="off">
        </p>
        <p>
          <label for="loginPassword"><b>Password:</b></label><br>
          <input type="password" id="loginPassword" style="width: 100%;" required autocomplete="off">
        </p>
        <p>
          <button type="submit" id="btnLoginSubmit" style="width: 100%; padding: 6px;">Login</button>
        </p>
        <p style="font-size: 13px; text-align: center;">
          New user? <a href="register.html">Register here</a>
        </p>
      </form>
    </fieldset>
  </div>

  <script src="../js/api/api-client.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get("registered") === "true") {
      document.getElementById("loginSuccessMsg").classList.remove("d-none");
    }

    document.getElementById("loginForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const alertBox = document.getElementById("loginAlertMsg");
      const btn = document.getElementById("btnLoginSubmit");
      alertBox.classList.add("d-none");

      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;

      btn.disabled = true;
      btn.innerText = "Logging in...";

      try {
        await ApiClient.login(email, password);
        window.location.replace("ai-forecast.html");
      } catch (err) {
        alertBox.innerText = err.message || "Invalid email or password.";
        alertBox.classList.remove("d-none");
        btn.disabled = false;
        btn.innerText = "Login";
      }
    });
  </script>
</body>
</html>
