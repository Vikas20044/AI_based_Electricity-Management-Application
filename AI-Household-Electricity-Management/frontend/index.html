<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Electricity Management System</title>
  <script>
    (function() {
      var token = localStorage.getItem("ai_electricity_token");
      var isAuth = localStorage.getItem("user_authenticated") === "true";
      if (token && isAuth) {
        window.location.replace("pages/ai-forecast.html");
      } else {
        window.location.replace("pages/login.html");
      }
    })();
  </script>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; background-color: #f7f7f7; color: #111111;">
  <p>Loading Electricity Management Portal... <a href="pages/login.html">Click here to continue</a>.</p>
</body>
</html>
