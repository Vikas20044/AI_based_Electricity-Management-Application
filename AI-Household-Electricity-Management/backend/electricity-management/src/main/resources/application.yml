server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: electricity-management-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/electricity_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:vikas}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  h2:
    console:
      enabled: false

  sql:
    init:
      mode: never

ml-service:
  base-url: ${ML_SERVICE_URL:http://localhost:8000}
  predict-endpoint: /api/v1/predict
  connect-timeout-ms: 4000
  read-timeout-ms: 6000

gruha-jyothi:
  state: Karnataka
  max-ceiling-kwh: 200.0
  entitlement-buffer-pct: 10.0

tariff:
  fixed-charge-per-kw-inr: 70.0
  slab1-max-units: 100
  slab1-rate-per-unit: 4.75
  slab2-max-units: 200
  slab2-rate-per-unit: 7.00
  slab3-rate-per-unit: 8.00
  electricity-tax-pct: 9.0

jwt:
  secret: ${JWT_SECRET:ai-electricity-management-super-secret-key-2026-secure-token-mca-major-project-key}
  expiration-hours: 24

cors:
  allowed-origins: "*"
